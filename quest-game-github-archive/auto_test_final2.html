<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автоматический тест финала 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loading {
            font-size: 24px;
            margin: 20px 0;
        }
        .success {
            color: #4CAF50;
            font-weight: bold;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        .info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <h1>🎯 Автоматический тест финала 2</h1>
    
    <div class="info">
        <h2>Тестовые данные команды:</h2>
        <p><strong>Название:</strong> Тестовая команда</p>
        <p><strong>Капитан:</strong> Алексей Петров</p>
        <p><strong>Результат:</strong> 45 очков</p>
        <p><strong>Код игры:</strong> MIN2024</p>
    </div>

    <div class="loading" id="status">⏳ Настройка тестовых данных...</div>

    <script>
        // Функция для автоматической настройки и перехода
        function setupAndRedirect() {
            try {
                console.log('🎯 Начинаем настройку тестовых данных...');
                
                // Устанавливаем тестовые данные команды
                const teamInfo = {
                    id: '5cb97849-0868-4a07-b4b1-071a12b2ecd0',
                    name: 'Тестовая команда',
                    captain_name: 'Алексей Петров',
                    players: ['Алексей Петров', 'Мария Сидорова'],
                    total_score: 45,
                    answers_count: 3
                };

                // Сохраняем в localStorage
                localStorage.setItem('team_id', teamInfo.id);
                localStorage.setItem('game_code', 'MIN2024');
                localStorage.setItem('current_team', JSON.stringify(teamInfo));

                console.log('✅ Тестовые данные установлены:', teamInfo);

                // Показываем успех
                document.getElementById('status').innerHTML = '✅ Данные настроены! Перенаправление через 2 секунды...';
                document.getElementById('status').className = 'success';

                // Перенаправляем на финальную страницу через 2 секунды
                setTimeout(() => {
                    console.log('🚀 Переходим на финальную страницу...');
                    window.location.href = '/congratulation-with-stats/MIN2024';
                }, 2000);

            } catch (error) {
                console.error('❌ Ошибка:', error);
                document.getElementById('status').innerHTML = '❌ Ошибка: ' + error.message;
                document.getElementById('status').className = 'error';
            }
        }

        // Запускаем автоматически при загрузке страницы
        window.onload = setupAndRedirect;
    </script>
</body>
</html>
